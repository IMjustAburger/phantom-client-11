
name: Build Phantom Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source ZIP
        run: |
          mkdir source
          ZIP=$(find . -maxdepth 2 -name '*.zip' -print -quit)
          test -n "$ZIP" || { echo "Source ZIP not found"; exit 1; }
          unzip -q "$ZIP" -d source

      - name: Build Phantom Client
        run: |
          PROJECT=$(find source -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \) -print -quit)
          test -n "$PROJECT" || { echo "Gradle project not found"; exit 1; }
          DIR=$(dirname "$PROJECT")
          cd "$DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon clean build
          else
            gradle --no-daemon clean build
          fi

      - name: Upload finished JAR
        uses: actions/upload-artifact@v4
        with:
          name: PhantomClient-1.7.0
          path: source/**/build/libs/*.jar
          if-no-files-found: error
